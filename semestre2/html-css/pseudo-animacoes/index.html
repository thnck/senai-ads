<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Prática de Pseudo-Classes</title>
</head>
<body>
    <h1>Pseudo-Classes CSS</h1>

    <h2>Interações</h2>
    <a href="https://thelastcall.vercel.app">Link</a>

    <button>Clique e segure</button>

    <h2>Formulário</h2>
    <form action="">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" required placeholder=" Thomas Alves">

        <label for="email">E-mail:</label>
        <input type="email" name="email" id="email" placeholder="exemplo@email.com">

        <label for="checkbox">Checkbox:</label>
        <input type="checkbox" name="" id="">
    </form>

    <h2>Lista</h2>
    <ul>
        <li>Primeiro</li>
        <li>Segundo</li>
        <li>Terceiro</li>
        <li>Quarto</li>
    </ul>

    <div class="caixa">Lalala</div>

    <section class="palco">
        <div class="bola"></div>
    </section>

    <section class="sistema">
        <div class="sol"></div>
    </div>

    <div class="orbita">
        <div class="planeta"></div>
    </div>
    </section>

</body>
</html>
