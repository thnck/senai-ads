<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display e Posicionamento</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Display</h1>

    <h2>display block</h2>

    <div class="caixa" block>Caixa 1</div>
    <div class="caixa" block>Caixa 2</div>

    <h2>display: inline</h2>

    <span>Elemento 1</span>
    <span>Elemento 2</span>
    <span>Elemento 3</span>

    <h2>display: inline-block</h2>

    <div class="caixa inline-block">Caixa</div>
    <div class="caixa inline-block">Caixa</div>
    <div class="caixa inline-block">Caixa</div>
    <div class="caixa inline-block">Caixa</div>
    <div class="caixa inline-block">Caixa</div>
    <div class="caixa inline-block">Caixa</div>
    <div class="caixa inline-block">Caixa</div>
    <div class="caixa inline-block">Caixa</div>
    <div class="caixa inline-block">Caixa</div>

    <h2>display: none</h2>

    <div class="caixa none">...</div>

    <h2>position</h2>
    <h3>position: relative</h3>

    <div class="caixa relative">relative</div>

    <h3>position: absolute</h3>

    <div class="caixa absolute">absolute</div>

    <h3>position: fixed</h3>

    <div class="caixa fixed">...</div>
</body>
</html>
