<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RGB HORIZONTAL</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        margin: 0;
        font-family: monospace;
        font-size: 100px;
        color: white;
      }
      div {
        width: 100vw;
      }
      .red {
        background-color: red;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 33.3vh;
      }
      .green {
        background-color: rgb(0, 255, 0);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 33.3vh;
      }
      .blue {
        background-color: blue;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 33.4vh;
      }
    </style>
  </head>
  <body>
    <div class="red">RED</div>
    <div class="green">GREEN</div>
    <div class="blue">BLUE</div>
  </body>
</html>
