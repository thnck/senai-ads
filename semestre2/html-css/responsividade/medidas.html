<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medidas responsivas</title>
    <style>
      body {
        margin: 0;
        font-family: monospace;
      }
      header {
        width: 100vw;
        background-color: blue;
        height: 20vh;
        color: white;

        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
      }
      main{
        width: 90vw;
        background-color: darkblue;
        height: 40vh;
        margin: auto;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      
      .caixa-grande{
        width: 80vw;
        height: 30vh;
        background-color: steelblue;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .caixa-pequena{
        width: 50vw;
        height: 15vh;
        background-color: aqua;
        font-size: large;
        font-weight: bold;
        display: flex;
        justify-content: center;
        align-items: center;

      }
      footer{
        background-color: blue;
        width: 100vw;
        height: 10vh;
        font-size: 30px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;


      }
    </style>
  </head>
  <body>
    <header>
      <h1>Unidades Responsivas</h1>
    </header>

    <main>
      <div class="caixa-grande">
        <div class="caixa-pequena">50% da caixa maior</div>
      </div>
    </main>

    <footer>10vh de altura</footer>
  </body>
</html>
